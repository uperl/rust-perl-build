[package]
name = "perl-build"
version = "0.2.0"
edition = "2024"
description = "Build new Perls from source, modelled after the Perl::Build CPAN distribution"
repository = "https://github.com/uperl/perl-build"
license = "MIT"
keywords = ["perl", "build", "cpan", "metacpan"]
categories = ["development-tools::build-utils"]

[lib]
name = "perl_build"
path = "src/lib.rs"

[dependencies]
metacpan-api-modern = { version = "0.3.0", git = "https://github.com/uperl/rust-metacpan-api-modern", tag = "v0.3.0" }
patch-perl = { version = "0.1.2", git = "https://github.com/uperl/rust-patch-perl", tag = "v0.1.2" }
cpan-distribution-extractor = { version = "0.1.1", git = "https://github.com/uperl/rust-cpan-distribution-extractor", tag = "v0.1.1" }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
