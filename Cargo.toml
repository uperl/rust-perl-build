[package]
name = "perl-build"
version = "0.1.0"
edition = "2024"
description = "Build new Perls from source, modelled after the Perl::Build CPAN distribution"
repository = "https://github.com/uperl/perl-build"
license = "MIT"
keywords = ["perl", "build", "cpan", "metacpan"]
categories = ["development-tools::build-utils"]

[lib]
name = "perl_build"
path = "src/lib.rs"

[dependencies]
metacpan-api-modern = { git = "https://github.com/uperl/rust-metacpan-api-modern", branch = "main" }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
